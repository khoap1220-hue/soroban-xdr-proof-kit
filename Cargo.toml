[package]
name = "soroban-xdr-proof-kit"
version = "0.3.0"
edition = "2021"
authors = ["Khoa Phan <khoap1220-hue@users.noreply.github.com>"]
description = "Zero-dependency Rust & WebAssembly toolkit for Stellar LedgerHeader binary XDR decoding, FIPS 180-4 SHA-256 cryptographic ancestry proofs, and Soroban History Archive checkpoint math."
license = "MIT"
repository = "https://github.com/khoap1220-hue/soroban-xdr-proof-kit"
keywords = ["stellar", "soroban", "xdr", "webassembly", "cryptography"]
categories = ["cryptography::cryptocurrencies", "wasm", "encoding"]

[[bin]]
name = "soroban-xdr-proof"
path = "src/bin/soroban-xdr-proof.rs"

[features]
default = []
wasm = []
